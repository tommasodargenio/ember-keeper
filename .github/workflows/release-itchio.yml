name: Release to itch.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (optional, e.g. 1.2.0). Defaults to itch.io auto-versioning."
        required: false

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Strip autoloads for missing local-only addons
        shell: bash
        run: |
          tmp=$(mktemp)
          while IFS= read -r line; do
            if [[ "$line" =~ ^[A-Za-z0-9_]+=\"\**res://addons/ ]]; then
              rel_path=$(sed -E 's/^[A-Za-z0-9_]+="\*?res:\/\/(.*)"$/\1/' <<< "$line")
              if [[ ! -f "$rel_path" ]]; then
                echo "Skipping autoload for missing addon file: $rel_path"
                continue
              fi
            fi
            echo "$line"
          done < project.godot > "$tmp"
          mv "$tmp" project.godot

      - name: Export Web build
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: build
          presets_to_export: Web
          cache: true

      - name: Publish to itch.io
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: ember-keeper
          ITCH_USER: tomdubliner
          PACKAGE: build/Web
          VERSION: ${{ steps.version.outputs.value }}
